<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#8b1e16">

<title>Taquería 5 de Mayo | Authentic Mexican Food</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: #2a160d;
    background:
        linear-gradient(rgba(255,245,220,.90), rgba(245,218,170,.92)),
        repeating-linear-gradient(
            45deg,
            #d9a45c 0px,
            #d9a45c 12px,
            #c98b42 12px,
            #c98b42 24px
        );
    display: flex;
    justify-content: center;
    padding: 20px 14px 40px;
}

.card {
    width: 100%;
    max-width: 440px;
    text-align: center;
}

.logo {
    width: 100%;
    border-radius: 18px;
    display: block;
    margin: 0 auto 18px;
    box-shadow: 0 8px 22px rgba(0,0,0,.28);
}

.info {
    background: rgba(255,250,235,.95);
    border-radius: 18px;
    padding: 18px 15px;
    margin-bottom: 18px;
    box-shadow: 0 6px 16px rgba(0,0,0,.18);
    border: 2px solid #d8b36a;
}

.address {
    font-size: 19px;
    font-weight: bold;
    line-height: 1.4;
}

.phone {
    margin-top: 12px;
    font-size: 25px;
    font-weight: bold;
}

.buttons {
    display: flex;
    flex-direction: column;
    gap: 13px;
}

.btn {
    width: 100%;
    min-height: 76px;
    border-radius: 17px;
    text-decoration: none;
    color: white;
    display: flex;
    align-items: center;
    padding: 12px 18px;
    box-shadow: 0 6px 13px rgba(0,0,0,.28);
    border: 2px solid rgba(255,255,255,.55);
}

.btn:active {
    transform: scale(.97);
}

.icon {
    width: 52px;
    font-size: 34px;
    margin-right: 15px;
}

.text {
    text-align: left;
    flex: 1;
}

.spanish {
    display: block;
    font-size: 18px;
    font-weight: 800;
}

.english {
    display: block;
    margin-top: 3px;
    font-size: 15px;
    font-weight: 800;
    color: #ffd84d;
}

.arrow {
    font-size: 28px;
}

.call {
    background: linear-gradient(#16853c,#086329);
}

.order {
    background: linear-gradient(#c92727,#971717);
}

.doordash {
    background: linear-gradient(#ff4b20,#d92808);
}

.directions {
    background: linear-gradient(#1671b9,#07508c);
}

.footer {
    margin-top: 20px;
    padding: 18px 12px;
    background: rgba(74,28,15,.92);
    color: white;
    border-radius: 17px;
    line-height: 1.45;
}

.footer-es {
    font-weight: bold;
    font-size: 16px;
}

.footer-en {
    color: #ffd84d;
    font-weight: bold;
    font-size: 14px;
    margin-top: 5px;
}
</style>
</head>

<body>

<main class="card">

    <img src="LOGO.PNG"
         alt="Taquería 5 de Mayo Authentic Mexican Food"
         class="logo">

    <div class="info">

        <div class="address">
            📍 524 N Scott Ave<br>
            Belton, MO 64012
        </div>

        <div class="phone">
            📞 (816) 331-5677
        </div>

    </div>

    <div class="buttons">

        <a class="btn call" href="tel:+18163315677">
            <div class="icon">☎️</div>
            <div class="text">
                <span class="spanish">LLAMAR AHORA</span>
                <span class="english">CALL NOW</span>
            </div>
            <div class="arrow">›</div>
        </a>

        <a class="btn order" href="tel:+18163315677">
            <div class="icon">🌮</div>
            <div class="text">
                <span class="spanish">ORDENAR POR TELÉFONO</span>
                <span class="english">ORDER BY PHONE</span>
            </div>
            <div class="arrow">›</div>
        </a>

        <a class="btn doordash"
           href="https://www.doordash.com/store/cinco-de-mayo-taqueria-y-carnecer%C3%ADa-belton-42180105/"
           target="_blank"
           rel="noopener">

            <div class="icon">🛍️</div>

            <div class="text">
                <span class="spanish">ORDENAR EN DOORDASH</span>
                <span class="english">ORDER ON DOORDASH</span>
            </div>

            <div class="arrow">›</div>
        </a>

        <a class="btn directions"
           href="https://www.google.com/maps/search/?api=1&query=524+N+Scott+Ave+Belton+MO+64012"
           target="_blank"
           rel="noopener">

            <div class="icon">📍</div>

            <div class="text">
                <span class="spanish">CÓMO LLEGAR</span>
                <span class="english">DIRECTIONS</span>
            </div>

            <div class="arrow">›</div>
        </a>

    </div>

    <div class="footer">
        <div class="footer-es">
            ¡GRACIAS POR APOYAR NEGOCIOS LOCALES!
        </div>

        <div class="footer-en">
            THANK YOU FOR SUPPORTING LOCAL BUSINESSES!
        </div>
    </div>

</main>

</body>
</html>
