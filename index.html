<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8b1e16">

  <title>Taquería 5 de Mayo | Authentic Mexican Food</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #2a160d;

      background:
        linear-gradient(
          rgba(255, 246, 225, 0.88),
          rgba(239, 211, 162, 0.92)
        ),
        repeating-linear-gradient(
          45deg,
          #d9a45c 0px,
          #d9a45c 12px,
          #c98b42 12px,
          #c98b42 24px
        );

      display: flex;
      justify-content: center;
      padding: 18px 14px 40px;
    }

    .card {
      width: 100%;
      max-width: 440px;
      text-align: center;
    }

    /* NUEVO LOGO */
    .logo {
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto 18px;
      border-radius: 18px;
      box-shadow: 0 8px 22px rgba(0,0,0,.25);
    }

    /* INFORMACION */
    .info {
      background: rgba(255,250,235,.96);
      border: 2px solid #d8b36a;
      border-radius: 18px;
      padding: 18px 15px;
      margin-bottom: 18px;
      box-shadow: 0 6px 16px rgba(0,0,0,.18);
    }

    .address {
      font-size: 19px;
      font-weight: 800;
      line-height: 1.4;
    }

    .phone {
      margin-top: 12px;
      font-size: 25px;
      font-weight: 900;
    }

    /* BOTONES */
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .btn {
      width: 100%;
      min-height: 78px;

      display: flex;
      align-items: center;

      padding: 12px 16px;

      border-radius: 17px;
      border: 2px solid rgba(255,255,255,.65);

      color: white;
      text-decoration: none;

      box-shadow: 0 6px 13px rgba(0,0,0,.28);

      transition:
        transform .12s ease,
        filter .12s ease;
    }

    .btn:hover {
      filter: brightness(1.08);
    }

    .btn:active {
      transform: scale(.97);
    }

    .icon {
      width: 58px;
      flex-shrink: 0;
      font-size: 34px;
      text-align: center;
      margin-right: 12px;
    }

    .text {
      text-align: left;
      flex: 1;
    }

    .spanish {
      display: block;
      font-size: 18px;
      font-weight: 900;
    }

    .english {
      display: block;
      margin-top: 3px;
      font-size: 15px;
      font-weight: 900;
      color: #ffd84d;
    }

    .arrow {
      font-size: 32px;
      font-weight: bold;
      padding-left: 8px;
    }

    /* COLORES */

    .call {
      background:
        linear-gradient(180deg, #16853c, #086329);
    }

    .order {
      background:
        linear-gradient(180deg, #c92727, #971717);
    }

    .doordash {
      background:
        linear-gradient(180deg, #ff4b20, #d92808);
    }

    .directions {
      background:
        linear-gradient(180deg, #1671b9, #07508c);
    }

    /* FOOTER */

    .footer {
      margin-top: 20px;
      padding: 20px 12px;

      background: rgba(74,28,15,.94);
      color: white;

      border-radius: 17px;

      box-shadow: 0 6px 16px rgba(0,0,0,.22);
    }

    .footer-es {
      font-weight: 900;
      font-size: 16px;
      line-height: 1.35;
    }

    .footer-en {
      color: #ffd84d;
      font-weight: 900;
      font-size: 14px;
      line-height: 1.35;
      margin-top: 7px;
    }

    .mexico {
      margin-top: 12px;
      font-size: 20px;
      letter-spacing: 4px;
    }

  </style>
</head>


<body>

  <main class="card">

    <!-- LOGO NUEVO -->
    <img
      src="LOGO.png"
      alt="Taquería 5 de Mayo - Authentic Mexican Food"
      class="logo"
    >


    <!-- DIRECCION Y TELEFONO -->

    <div class="info">

      <div class="address">
        📍 524 N Scott Ave<br>
        Belton, MO 64012
      </div>

      <div class="phone">
        📞 (816) 331-5677
      </div>

    </div>


    <!-- BOTONES -->

    <div class="buttons">


      <!-- LLAMAR AHORA -->

      <a
        class="btn call"
        href="tel:+18163315677"
      >

        <div class="icon">
          ☎️
        </div>

        <div class="text">
          <span class="spanish">
            LLAMAR AHORA
          </span>

          <span class="english">
            CALL NOW
          </span>
        </div>

        <div class="arrow">
          ›
        </div>

      </a>


      <!-- ORDENAR POR TELEFONO -->

      <a
        class="btn order"
        href="tel:+18163315677"
      >

        <div class="icon">
          🌮
        </div>

        <div class="text">

          <span class="spanish">
            ORDENAR POR TELÉFONO
          </span>

          <span class="english">
            ORDER BY PHONE
          </span>

        </div>

        <div class="arrow">
          ›
        </div>

      </a>


      <!-- DOORDASH -->

      <a
        class="btn doordash"
        href="https://www.doordash.com/store/cinco-de-mayo-taqueria-y-carnecer%C3%ADa-belton-42180105/"
        target="_blank"
        rel="noopener noreferrer"
      >

        <div class="icon">
          🛍️
        </div>

        <div class="text">

          <span class="spanish">
            ORDENAR EN DOORDASH
          </span>

          <span class="english">
            ORDER ON DOORDASH
          </span>

        </div>

        <div class="arrow">
          ›
        </div>

      </a>


      <!-- COMO LLEGAR -->

      <a
        class="btn directions"
        href="https://www.google.com/maps/search/?api=1&query=524+N+Scott+Ave+Belton+MO+64012"
        target="_blank"
        rel="noopener noreferrer"
      >

        <div class="icon">
          📍
        </div>

        <div class="text">

          <span class="spanish">
            CÓMO LLEGAR
          </span>

          <span class="english">
            DIRECTIONS
          </span>

        </div>

        <div class="arrow">
          ›
        </div>

      </a>


    </div>


    <!-- MENSAJE FINAL -->

    <div class="footer">

      <div class="footer-es">
        ¡GRACIAS POR APOYAR NEGOCIOS LOCALES!
      </div>

      <div class="footer-en">
        THANK YOU FOR SUPPORTING LOCAL BUSINESSES!
      </div>

      <div class="mexico">
        🇲🇽 🌮 🇲🇽
      </div>

    </div>

  </main>

</body>
</html>
