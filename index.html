<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Taquería 5 de Mayo</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
    background: #1c1c1c;
}

body {
    display: flex;
    justify-content: center;
}

.poster {
    position: relative;
    width: 100%;
    max-width: 600px;
}

.poster-image {
    width: 100%;
    height: auto;
    display: block;
}

/* ZONAS TÁCTILES INVISIBLES */

.hotspot {
    position: absolute;
    left: 12%;
    width: 76%;
    z-index: 10;
    display: block;
    cursor: pointer;
    -webkit-tap-highlight-color: rgba(255,255,255,0.20);
}

/* 🟢 LLAMAR AHORA */

.call {
    top: 44.5%;
    height: 9%;
}

/* 🔴 ORDENAR POR TELÉFONO */

.order {
    top: 53.5%;
    height: 9%;
}

/* 🟠 DOORDASH */

.doordash {
    top: 62.5%;
    height: 9%;
}

/* 🔵 CÓMO LLEGAR */

.directions {
    top: 71.5%;
    height: 9%;
}

</style>
</head>

<body>

<div class="poster">

    <!-- IMAGEN COMPLETA -->

    <img
        src="LOGO.png"
        class="poster-image"
        alt="Taquería 5 de Mayo"
    >


    <!-- 🟢 LLAMAR AHORA -->

    <a
        class="hotspot call"
        href="tel:+18163315677"
        aria-label="Llamar ahora"
    ></a>


    <!-- 🔴 ORDENAR POR TELÉFONO -->

    <a
        class="hotspot order"
        href="tel:+18163315677"
        aria-label="Ordenar por teléfono"
    ></a>


    <!-- 🟠 ORDENAR EN DOORDASH -->

    <a
        class="hotspot doordash"

        href="https://www.doordash.com/store/cinco-de-mayo-taqueria-y-carnecer%C3%ADa-belton-42180105/"

        target="_blank"
        rel="noopener noreferrer"

        aria-label="Ordenar en DoorDash"
    ></a>


    <!-- 🔵 CÓMO LLEGAR -->

    <a
        class="hotspot directions"

        href="https://www.google.com/maps/search/?api=1&query=524+N+Scott+Ave+Belton+MO+64012"

        target="_blank"
        rel="noopener noreferrer"

        aria-label="Cómo llegar"
    ></a>

</div>

</body>
</html>
