<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#efe0bd">

  <title>
    Taquería 5 de Mayo | Authentic Mexican Food
  </title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #efe0bd;
      font-family: Arial, Helvetica, sans-serif;

      display: flex;
      justify-content: center;
    }

    .page {
      width: 100%;
      max-width: 520px;
    }

    /*
      CONTENEDOR DE LA IMAGEN
    */

    .poster {
      position: relative;
      width: 100%;
    }

    .poster img {
      width: 100%;
      height: auto;
      display: block;
    }


    /*
      ZONAS INVISIBLES SOBRE
      LOS BOTONES DE LA FOTO
    */

    .tap-button {
      position: absolute;

      left: 16%;

      width: 68%;

      z-index: 10;

      display: block;

      cursor: pointer;

      -webkit-tap-highlight-color:
        rgba(255,255,255,.15);

      border-radius: 15px;
    }


    /*
      BOTÓN VERDE
      LLAMAR AHORA
    */

    .call {
      top: 45.4%;
      height: 8.3%;
    }


    /*
      BOTÓN ROJO
      ORDENAR POR TELÉFONO
    */

    .phone-order {
      top: 54.2%;
      height: 8.2%;
    }


    /*
      BOTÓN NARANJA
      DOORDASH
    */

    .doordash {
      top: 63.1%;
      height: 8.3%;
    }


    /*
      BOTÓN AZUL
      DIRECCIONES
    */

    .directions {
      top: 72.1%;
      height: 8.4%;
    }


    /*
      EFECTO AL TOCAR
    */

    .tap-button:active {
      background:
        rgba(255,255,255,.12);
    }

  </style>
</head>


<body>

  <main class="page">

    <div class="poster">


      <!-- IMAGEN COMPLETA -->

      <img
        src="LOGO.png"
        alt="Taquería 5 de Mayo - Authentic Mexican Food"
      >


      <!--
        BOTÓN VERDE
        LLAMAR AHORA / CALL NOW
      -->

      <a
        class="tap-button call"
        href="tel:+18163315677"
        aria-label="Llamar ahora - Call now"
      ></a>


      <!--
        BOTÓN ROJO
        ORDENAR POR TELÉFONO
      -->

      <a
        class="tap-button phone-order"
        href="tel:+18163315677"
        aria-label="Ordenar por teléfono - Order by phone"
      ></a>


      <!--
        BOTÓN NARANJA
        DOORDASH
      -->

      <a
        class="tap-button doordash"

        href="https://www.doordash.com/store/cinco-de-mayo-taqueria-y-carnecer%C3%ADa-belton-42180105/"

        target="_blank"

        rel="noopener noreferrer"

        aria-label="Ordenar en DoorDash - Order on DoorDash"
      ></a>


      <!--
        BOTÓN AZUL
        DIRECCIONES
      -->

      <a
        class="tap-button directions"

        href="https://www.google.com/maps/search/?api=1&query=524+N+Scott+Ave+Belton+MO+64012"

        target="_blank"

        rel="noopener noreferrer"

        aria-label="Cómo llegar - Directions"
      ></a>


    </div>

  </main>

</body>
</html>
